- id: "memo-20250127-1"
  date: "2025-01-27 15:12:14"
  pinned: true
  content: |
    皎洁的满月对玛格丽特极力相助，亮得胜过最亮的电灯。她清楚地看到，坐在椅上的人的两眼毫无生气，像个盲人，他在急切地不住地搓着双手，两只视而不见的眼睛凝望着空中的一轮玉盘。玛格丽特还看到，那是一个笨重的石椅，上面似乎还有火花在闪动；石椅旁边卧着一只黑毛尖耳朵大狗，也像它的主人一样不安地凝望着月亮。

    坐在椅上的人的脚旁扔着些碎坛片，地上有一汪深红色的水，像是永远不会干涸。

    骑士们勒住坐骑。

    “您的小说，他们看过了，”沃兰德转身对大师说，“他们只提出一点：对于小说没有结尾表示遗憾。所以，我现在就想让您看看您书中的主人公。将近两千年了，他一直坐在这石平台上，睡在这里。然而，每当满月来临时，他就睡不着，他为失眠所苦。满月不仅折磨他，还折磨他忠实的卫士——这只狗。如果说，怯懦果真是人类最严重的缺陷，那么，大概，这只狗总没有犯怯懦的罪过吧。这只猛犬除了雷电之外是什么都不畏惧的。可是，有什么办法呢，谁在爱，谁就应该与他所爱的人分担命运。”
  source: "《大师和玛格丽特》 (page: 726)"
  author: "米哈伊尔·布尔加科夫"
  device: "Mac"
  tags: ["书摘", "外国文学"]

- id: "memo-20241028-2"
  date: "2024-10-28 20:07:19"
  content: |
    I feared the dragon. Every morning, I straggled in somewhere around the tail, and occasionally I had to be reminded. For a while, I swore to do better; I glued my eyes to the phone at six thirty a.m., fantasizing about finishing as a top-five dragon connector. But it was impossible; Chinese people were incredibly skilled at this kind of thing, and often there were seven or eight completed dragon links by 6:31.
  source: "Other Rivers (page: 466)"
  author: "Peter Hessler"
  device: "Mac"
  tags: ["书摘", "非虚构"]

- id: "memo-20241028-1"
  date: "2024-10-28 20:06:29"
  content: |
    I almost never saw children. I knew they were up there: a game called Mini Table Football to 2703, a Huanqi toy box to 1804. The compound printed out documents on request and left them in the lobby, and I noticed homework assignments for kids who were attending online school: for 2102, a chapter on chemistry; for 3802, a handout on poems from the Northern and Southern dynasties.
  source: "Other Rivers (page: 412)"
  author: "Peter Hessler"
  device: "Mac"
  tags: ["书摘", "非虚构"]

