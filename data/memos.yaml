- id: "memo-20241020-1"
  date: "2024-10-20 18:14:49"
  content: |
    “我们已经流了那么多血，怎么可以让这些鲜血白流！那些先走一步的灵魂，正瞪大眼睛看着我们啊……”

    男子说话的尾音有点沙哑，不断听见“血”这个字，使你感到胸口一阵闷痛，于是再次张口深呼吸。

    灵魂又没有躯体，要如何瞪大眼睛看着我们。
  source: "《少年来了》 (page: 25)"
  author: "韩江"
  device: "Mac"
  tags: ["书摘", "小说"]

- id: "memo-20240515-2"
  date: "2024-05-15 14:31:01"
  content: |
    为什么我们总是很想纪念自己？甚至在我们还活着的时候也是如此？我们希望表明我们的存在，就像狗在消防栓上撒尿一样。我们将照片装入相框挂起来，将我们的毕业文凭、镀银奖杯摆出来；我们在衣服上印上自己姓名的缩写，把我们的姓名刻在树上、涂在厕所的墙壁上。这都是出于同一种冲动。我们从中希望得到什么呢？掌声，嫉妒，还是尊敬？还是仅仅想得到任何一种形式的关注？

    至少，我们需要有一个见证。我们不甘心我们自己的声音像收音机里的广播一样，慢慢低沉下去，直至消失。
  source: "《盲刺客》"
  author: "玛格丽特·阿特伍德"
  device: "微信读书"
  tags: ["书摘", "思考"]

